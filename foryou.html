<!-- حاوية الفيديوهات -->
<div id="reels-container">
    <!-- هتتحمل الفيديوهات هنا تلقائياً -->
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const playlistId = 'PLOKPeQjAK7WBOeeYrmsMeJNj2ecrV48lx';
    const container = document.getElementById('reels-container');

    // رابط RSS المباشر من يوتيوب عبر بروكسي مجاني مفتوح بدون API Key
    const targetUrl = `https://www.youtube.com/feeds/videos.xml?playlist_id=${playlistId}`;
    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;

    fetch(proxyUrl)
        .then(response => {
            if (!response.ok) throw new Error('خطأ في الاتصال');
            return response.text();
        })
        .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
        .then(data => {
            const entries = data.getElementsByTagName("entry");
            if (!entries || entries.length === 0) return;

            container.innerHTML = ''; // تفريغ الحاوية

            Array.from(entries).forEach(entry => {
                // استخراج id الفيديو والعنوان
                const videoId = entry.getElementsByTagName("yt:videoId")[0]?.textContent || 
                                entry.getElementsByTagName("videoId")[0]?.textContent;
                const title = entry.getElementsByTagName("title")[0]?.textContent;

                if (videoId && title) {
                    const cleanTitle = title.replace(/"/g, '&quot;');
                    const cardHTML = `
                    <div class="reel-card" data-title="${cleanTitle}" onclick="openReelModal('${videoId}')">
                        <img src="https://img.youtube.com/vi/${videoId}/maxresdefault.jpg" 
                             onerror="this.src='https://img.youtube.com/vi/${videoId}/hqdefault.jpg'" 
                             alt="فيديو: ${cleanTitle}" loading="lazy">
                        <div class="play-icon"><i class="fa-solid fa-play"></i></div>
                    </div>
                    `;
                    container.innerHTML += cardHTML;
                }
            });
        })
        .catch(err => console.error('حدث خطأ أثناء جلب الفيديوهات:', err));
});
</script>
