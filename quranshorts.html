<!-- حاوية قسم القرآن القصير -->
<script>
(async () => {
    // ======== الإعدادات الخاصة بقسم القرآن القصير ========
    const API_KEY      = 'AIzaSyBzK0VIpD-eVMr5rCehWjiHw86GrOtei6c'; 
    const PLAYLIST_ID  = 'PLK6c_Q6pjUCE';                         // ID قائمة تشغيل القرآن
    const CONTAINER_ID = 'quranshorts-container';                 
    const SUFFIX       = ' - فارس الشريف';
    const CACHE_MINUTES = 60;                                     
    // ====================================================

    const box = document.getElementById(CONTAINER_ID);
    if (!box) return;
    
    // تحديد العنصر الأب للقسم لإظهاره
    const section = box.closest('.dynamic-reel-section') || box;
    const CACHE_KEY = 'ytpl_' + PLAYLIST_ID;

    function renderList(list) {
        if (!list || !list.length) return;
        
        box.innerHTML = '';
        list.forEach(v => {
            const card = document.createElement('div');
            card.className = 'reel-card';
            card.setAttribute('data-title', v.title);
            card.onclick = () => openReelModal(v.id);

            const img = document.createElement('img');
            img.src = v.thumb;
            img.alt = v.title + SUFFIX;
            img.loading = 'lazy';

            // استخدام reel-play-btn ليتطابق مع الـ CSS في index.html
            const play = document.createElement('div');
            play.className = 'reel-play-btn';
            play.innerHTML = '<i class="fa-solid fa-play"></i>';

            card.append(img, play);
            box.appendChild(card);
        });

        // أهم خطوة: إظهار القسم بوضوح على الشاشة
        if (section) section.style.display = 'block';

        box.dispatchEvent(new Event('scroll'));
    }

    // 1. عرض البيانات من الكاش فوراً إن وجدت
    let hasCache = false;
    try {
        const c = JSON.parse(localStorage.getItem(CACHE_KEY));
        if (c && c.l && c.l.length) {
            renderList(c.l);
            hasCache = true;
            if (Date.now() - c.t < CACHE_MINUTES * 60000) return;
        }
    } catch (e) {}

    // 2. تحديث البيانات من YouTube API
    try {
        let items = [], token = '';
        do {
            const url = 'https://www.googleapis.com/youtube/v3/playlistItems'
                + '?part=snippet&maxResults=50&playlistId=' + encodeURIComponent(PLAYLIST_ID)
                + '&key=' + API_KEY + (token ? '&pageToken=' + token : '');
            const res = await fetch(url);
            if (!res.ok) throw new Error('API ' + res.status);
            const data = await res.json();
            items = items.concat(data.items || []);
            token = data.nextPageToken || '';
        } while (token);

        const list = items
            .filter(it => it.snippet && it.snippet.title !== 'Private video' && it.snippet.title !== 'Deleted video')
            .map(it => {
                const s = it.snippet, t = s.thumbnails || {};
                const th = t.maxres || t.standard || t.high || t.medium || t.default;
                return { id: s.resourceId.videoId, title: s.title, thumb: th ? th.url : '' };
            })
            .filter(v => v.thumb);

        if (list.length) {
            renderList(list);
            try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), l: list })); } catch (e) {}
        } else if (!hasCache && section) {
            section.style.display = 'none';
        }
    } catch (err) {
        console.error('فشل تحميل القائمة:', err);
        if (!hasCache && section) section.style.display = 'none';
    }
})();
</script>
